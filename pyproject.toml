[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hassanking01", email = "hassanahchtar953@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arcade>=3.3.3",
    "bm25s>=0.3.11",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pymilvus>=3.0.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }